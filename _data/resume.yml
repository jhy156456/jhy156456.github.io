publications:
  - title: A Comparative Study of Machine Learning and Ensemble Models for Photovoltaic Power Prediction
    title_ko: 태양광 발전량 예측을 위한 머신러닝 및 앙상블 모델 비교 연구
    date: 2024.08.22
    summary: LGBM과 Informer를 결합한 앙상블 모델로 예보 의존도를 낮추고 최신 관측 데이터를 통합해, 기존 LGBM·LSTM·Informer·LTSF-linear 대비 높은 예측 성능과 지역 일반화를 입증
    abstract_en: >-
      Globally, photovoltaic power is selected as an effort to minimize greenhouse gas emissions and produce alternative
      energy that does not depend on fossil fuels. However, the variability of photovoltaic power due to weather conditions
      complicates power supply management. Continuous research is underway to predict photovoltaic power accurately. Key
      factors for accurate prediction include tracking the sun's position using solar altitude and azimuth, weather forecasts,
      and the location of solar panels. Additionally, new technologies and approaches are developed annually worldwide to
      reduce prediction variability and improve model accuracy. In this paper, to enhance the accuracy of photovoltaic power
      predictions we proposes an ensemble model combining LGBM ,one of the Gradient Boosting Machines, with Informer, a deep
      learning time series prediction model. Photovoltaic power prediction has no choice but to depend on weather forecast
      data. However, in this study, we integrates the latest observational data and considers weather characteristics to
      predict stable power generation without overly depending on forecast data. To evaluate the proposed model's performance,
      its predictions were compared with those of previously studied models LGBM, LSTM, Informer, and LTSF-linear. For
      comparison, power generation data from three photovoltaic power plants in South Korea over one year, observed weather
      data from four providers, and two months of weather forecast data were used. Experiments demonstrated that the proposed
      model has higher prediction performance and can be applied across various regions.
    abstract_ko: >-
      세계적으로 온실 가스 배출을 최소화하고 화석 연료에 의존하지 않는 대체 에너지를 생산하기 위한 노력으로 태양광 발전을 선택하고 있다. 하지만, 태양광 발전량은 날씨 상황에 따라 에너지 변동성이 크게 변하기 때문에
      전력 수급 관리가 어려운 상황이다. 이를 해결하기 위해 발전량을 예측하는 연구가 지속적으로 이루어 지고 있다. 발전량 예측을 위한 가장 중요한 요소는 태양 고도와 방위각을 활용한 태양 위치 추적, 기상 날씨 예보,
      태양광 패널의 위치 등의 여러 정보들을 고려해야 한다. 또한 예측의 변동성을 줄이고 모델의 정확성을 향상시키기 위해 새로운 기술과 접근 방식이 매년 전 세계적으로 발생하고 있다. 본 논문에서는 태양광 발전량 예측의
      정확성을 향상하기 위해, Gradient Boosting Machine중 하나인 LGBM과 딥러닝 시계열 예측 모델인 Informer를 결합한 앙상블 모델을 제안했다. 태양광 발전량 예측은 날씨 예보 데이터에 의존할
      수 밖에 없다. 하지만, 본 연구에서는 예보 데이터에 지나치게 의존하지 않으면서 안정적인 발전량을 예측 하기 위해 최신의 관측 데이터를 모델에 통합하고 날씨의 특성을 고려했다. 제안 모델의 성능을 평가하기 위해,
      기존에 연구된 LGBM, LSTM, Informer 및 LTSF-linear 모델과의 예측 결과를 비교했다. 비교를 위해 한국 내 세 개 지역의 태양광 발전소에서 1 년 동안 생산된 발전량과, 네 곳의 기상 정보
      업체에서 제공하는 관측된 날씨 데이터, 그리고 두 달 간의 날씨 예보 데이터를 사용했다. 실험을 통해 제안 모델이 기존 모델들 보다 높은 예측 성능과 다양한 지역에 적용 가능함을 입증했다.

